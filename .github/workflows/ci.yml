name: Factory CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  frontend-and-scaffold:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Factory
        run: npm install --no-audit --no-fund
        working-directory: src/frontend
      - name: Typecheck Factory
        run: npm run typecheck
        working-directory: src/frontend
      # These two non-optional steps form ONE required frontend test gate.
      # CLI/Compose subprocesses must not compete with parallel Vitest workers.
      - name: Unit tests (parallel, without Docker Compose CLI)
        run: npm run test:ci-units
        working-directory: src/frontend
      - name: Generated scaffold and Docker Compose contract tests (isolated, required)
        run: npm run test:ci-scaffold
        working-directory: src/frontend
      - name: Build Factory
        run: npm run build
        working-directory: src/frontend
      - name: Validate remote runner syntax
        run: npm run check
        working-directory: src/runner
      - name: Test remote runner protocol and worker
        run: npm test
        working-directory: src/runner
      - name: Smoke test actual isolated Docker execution (ephemeral CI host)
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
        run: |
          docker pull node:22-bookworm-slim
          timeout 240s node src/runner/scripts/docker-smoke.mjs
      - name: Execute actual canary Docker lifecycle (rootful CI host ONLY, not rootless VM)
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
        run: timeout 90s node src/runner/scripts/rootless-canary-ci-smoke.mjs
      - name: Check runner Docker Compose configuration
        run: docker compose --env-file docker/runner/.env.example -f docker/runner/compose.yml config --quiet
      - name: Preflight resolved runner Compose topology (no VM or tunnel)
        run: node src/runner/preflight.mjs compose --env-file=docker/runner/.env.example
      - name: Validate opt-in private operator registry Compose override
        run: |
          docker compose --env-file docker/runner/.env.example -f docker/runner/compose.yml -f docker/runner/compose.repair-operators.yml config --quiet
          node src/runner/preflight.mjs compose --operator-registry --env-file=docker/runner/.env.example
      - name: Validate all reviewed secret-backed authentication Compose profiles
        run: |
          docker compose --env-file docker/runner/.env.example -f docker/runner/compose.yml -f docker/runner/compose.runner-key-file.yml config --quiet
          node src/runner/preflight.mjs compose --runner-key-file --env-file=docker/runner/.env.example
          docker compose --env-file docker/runner/.env.example -f docker/runner/compose.yml -f docker/runner/compose.tenants.yml config --quiet
          node src/runner/preflight.mjs compose --tenants --env-file=docker/runner/.env.example
          docker compose --env-file docker/runner/.env.example -f docker/runner/compose.yml -f docker/runner/compose.runner-key-file.yml -f docker/runner/compose.repair-operators.yml config --quiet
          node src/runner/preflight.mjs compose --runner-key-file --operator-registry --env-file=docker/runner/.env.example
      - name: Build remote runner API container
        run: docker build -f docker/runner/Dockerfile.api -t softwarefactory-runner-api:ci .
      - name: Build remote runner worker container
        run: docker build -f docker/runner/Dockerfile.worker -t softwarefactory-runner-worker:ci .
      - name: Generate sample application
        run: npm run fixture
        working-directory: src/frontend
      - name: Verify generated JWT fixture with ephemeral signing key
        run: node src/runner/scripts/auth-fixture-smoke.mjs src/frontend/generated-fixture
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
      - name: Build generated ASP.NET Core application
        run: dotnet build src/backend/applications/Api/Api.csproj -c Release
        working-directory: src/frontend/generated-fixture
      - name: Verify generated API rejects unsafe auth modes and HTTP issuers
        run: node src/runner/scripts/auth-startup-smoke.mjs src/frontend/generated-fixture
      - name: Build generated React application
        run: npm install --no-audit --no-fund && npm run build
        working-directory: src/frontend/generated-fixture/src/frontend/web
      - name: Run generated Playwright browser smoke inside networkless Docker
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
        run: |
          docker pull mcr.microsoft.com/playwright:v1.64.1-noble
          timeout 300s node src/runner/scripts/playwright-smoke.mjs src/frontend/generated-fixture
      - name: Browser E2E Factory writer lease, GitHub import race and lost-ack reconciliation
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
        run: timeout 180s node src/runner/scripts/factory-browser-lock-smoke.mjs
      - name: Run React-to-.NET OIDC browser and Production HTTPS issuer/JWKS integration on private Docker network
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
        run: |
          docker pull mcr.microsoft.com/dotnet/aspnet:11.0
          docker pull postgres:17-alpine
          docker pull nginx:1.27-alpine
          timeout 300s node src/runner/scripts/fullstack-smoke.mjs src/frontend/generated-fixture
      - name: Capture Playwright failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-generated-fixture-diagnostics
          path: src/frontend/generated-fixture/src/frontend/web/test-results/
          if-no-files-found: ignore
          retention-days: 3
